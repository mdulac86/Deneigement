name: Base historique de fiabilité
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/historique.json', 'scripts/history.py']
permissions:
  contents: write
concurrency:
  group: historique
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prévisions passées (ECMWF, GFS) et neige mesurée
        run: |
          python - <<'PY'
          import json, subprocess
          for a, b in json.load(open('config/historique.json'))['periodes']:
              subprocess.run(['python', 'scripts/history.py', a, b], check=True)
          PY
      - name: Publier les résultats
        run: |
          git config user.name 'Robot Déneigement'
          git config user.email 'actions@users.noreply.github.com'
          git add data/verification/historique-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Base historique de fiabilité'
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push && break; sleep 10; done
          fi
