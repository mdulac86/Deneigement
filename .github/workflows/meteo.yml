name: Robot météo et publication
on:
  schedule:
    # Toutes les heures : passage complet à 0 h, 6 h, 12 h et 18 h (heure du Québec);
    # passage rapide les autres heures seulement si une tempête est en vue (data/weather.json -> tempete).
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: meteo-production
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.clock.outputs.collect }}
      rapide: ${{ steps.clock.outputs.rapide }}
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://raw.githubusercontent.com/${{ github.repository }}/main/data/weather.json
        run: |
          H=$(TZ=America/Toronto date +%-H)
          if [ "$EVENT" != "schedule" ] || [[ " 0 6 12 18 " == *" $H "* ]]; then
            echo "Passage complet ($EVENT, ${H} h)"
            echo "collect=true" >> "$GITHUB_OUTPUT"; echo "rapide=0" >> "$GITHUB_OUTPUT"
          elif curl -fsS "$SITE?t=$(date +%s)" | python3 -c "import json,sys; sys.exit(0 if (json.load(sys.stdin).get('tempete') or {}).get('active') else 1)"; then
            echo "Tempête en vue : passage rapide (${H} h)"
            echo "collect=true" >> "$GITHUB_OUTPUT"; echo "rapide=1" >> "$GITHUB_OUTPUT"
          else
            echo "Temps calme : pas de passage (${H} h)"
            echo "collect=false" >> "$GITHUB_OUTPUT"; echo "rapide=0" >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: schedule
    if: needs.schedule.outputs.collect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Actualiser les sources et les archives
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RAPIDE: ${{ needs.schedule.outputs.rapide }}
        run: python scripts/collect.py
      - name: Tableau de fiabilité
        if: needs.schedule.outputs.rapide != '1'
        run: python scripts/verify.py || echo 'Fiabilité non recalculée'
      - name: Conserver le journal partagé
        run: |
          git config user.name 'Robot Déneigement'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            if [ "${{ needs.schedule.outputs.rapide }}" = "1" ]; then git commit -m 'Passage rapide (tempête)'; else git commit -m 'Actualiser météo et relevés Climat Québec'; fi
            # Le relais du bureau peut publier pendant la collecte : on se replace dessus.
            for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Préparer le site
        run: |
          mkdir -p dist/data
          cp index.html app.js style.css manifest.webmanifest icon.svg logo-dulac.png sw.js terres-maine.geojson dist/
          cp data/weather.json dist/data/
          cp data/season-*.json dist/data/
          cp data/normale-par-date.json dist/data/
          mkdir -p dist/data/verification && cp data/verification/scores.json dist/data/verification/ 2>/dev/null || true
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
